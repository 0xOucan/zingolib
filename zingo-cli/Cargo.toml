[package]
name = "zingo-cli"
description = "Zingo command line wallet."
version = "0.5.0"
authors = ["<zingo@zingolabs.org>"]
edition = "2024"
repository = "https://github.com/zingolabs/zingolib"
homepage = "https://github.com/zingolabs/zingolib"
license = "MIT"

[features]
# The mixnet transport is a default capability: every ordinary build carries
# it, so `network on|off|status` never demands a rebuild (ADR 0026). Compiling it
# starts nothing — an offline session executes no proxy and touches no network
# (ADR 0025); only an Online session's go-online moment provisions (ADR 0024).
# Opt out with `--no-default-features` (or run-cli's `--nakednet`); the
# command then reports the capability was switched off at build time.
default = ["nym"]
nym = ["zingolib/nym"]
# The quarantined nakednet acts, compiled back in for testing and never for
# use. Never a default: a session that goes online engages nakednet only for
# sync, so compiling these back in is a deliberate, review-gated test act
# (2026-08-06 ruling). Two things live behind it. The nakednet
# server-selection sweep, which ADR 0029 deletes from ordinary builds. And,
# in a build without `nym`, the ability to go online at all: ADR 0026 makes
# the mixnet a default capability and ADR 0024 forces Mixnet Mode on at the
# go-online moment, so no ordinary build can run an online session with no
# mixnet beside it, and a measurement that separates the mixnet's cost from
# the scan's needs exactly that arm.
nakednet-test-mode = []
# LeekWallet hardware signing (prototype, not upstream): the `pczt` command,
# `--leek-port` and `--leek-ble`, over USB, Bluetooth LE, QR and the SD card.
# The SDK crates come from github.com/0xOucan/leekwallet-zcash at a pinned
# commit. Bluetooth is btleplug, which on Linux builds against libdbus-1
# (`libdbus-1-dev`).
leekwallet = [
    "dep:leek-zcash",
    "dep:leek-device",
    "dep:leek-ur",
    "dep:qrcode",
]
# `pczt sign_qr --camera`: reads the board's reply off a V4L2 webcam (Linux).
leekwallet-qr-camera = ["leekwallet", "dep:linuxvideo", "dep:rqrr"]

[dependencies]
pepper-sync = { workspace = true }
zingo_common_components = { workspace = true }
# No direct zingo-netutils dependency: this consumer funnels through
# zingolib's re-exports (`zingolib::netutils`, ADR 0024 decision 7). The
# dev-dependency below reaches netutils' test scaffolding directly, which
# ships nothing and creates no duplicate copy.
zingolib = { workspace = true, features = ["perspective"] }

zcash_address = { workspace = true }
zcash_client_backend = { workspace = true }
zcash_keys = { workspace = true }
zcash_protocol = { workspace = true }

clap = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
indoc = { workspace = true }
json = { workspace = true }
log = { workspace = true }
nonempty = { workspace = true }
rustyline = { workspace = true }
zingo-status = { workspace = true }
shellwords = { workspace = true }
# macros + time back the transmit heartbeat's select!/interval; rt-multi-thread
# backs the command runtime (previously inherited via feature unification).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { workspace = true }
zip32 = { workspace = true }
thiserror.workspace = true
zingo-net-diag.workspace = true
# Apache-2.0, the LeekWallet SDK, pinned to one commit of its main branch.
# leek-device is named to turn on its desktop links: `serial` (USB) and
# `ble` (Bluetooth LE, the LeekWallet app's btleplug transport); the code
# reaches it through `leek_zcash::leek_device`. leek-ur is the UR of the QR
# air gap (`ur:leek-pczt` out, `ur:leek-zsig` back).
leek-zcash = { git = "https://github.com/0xOucan/leekwallet-zcash", rev = "e58dc8d620bf78a02640b676db182c64934d61ef", optional = true }
leek-device = { git = "https://github.com/0xOucan/leekwallet-zcash", rev = "e58dc8d620bf78a02640b676db182c64934d61ef", optional = true, features = ["serial", "ble"] }
leek-ur = { git = "https://github.com/0xOucan/leekwallet-zcash", rev = "e58dc8d620bf78a02640b676db182c64934d61ef", optional = true }
# The QR codes drawn in the terminal or an HTML page; without its `image`
# feature it is pure Rust with no dependencies (MIT OR Apache-2.0).
qrcode = { version = "=0.14.1", default-features = false, optional = true }
# The webcam reader of `leekwallet-qr-camera`: a pure-Rust QR decoder
# ((MIT OR Apache-2.0) AND ISC), and V4L2 by ioctls (0BSD, Linux only).
rqrr = { version = "=0.11.0", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
linuxvideo = { version = "=0.3.5", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# The LeekWallet round-trip test's software signer (feature `leekwallet`).
bip0039 = { workspace = true }
orchard = { workspace = true }
pczt = { workspace = true }
# The offline-contract tests build Indexerless clients from synthetic
# wallets, so every command's offline behavior is pinned without a network.
zingolib = { workspace = true, features = ["testutils"] }
zingo_test_vectors = { workspace = true }
# The heartbeat and log-file tests read their temporal parameters from
# `time::test`.
zingo-netutils = { workspace = true, features = ["testutils"] }
# test-util powers the paused-clock heartbeat tests.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "test-util"] }
tokio-stream = "0.1"
tonic = { workspace = true }
zingo-net-diag.workspace = true
zingo_grpc_proxy = { git = "https://github.com/zingolabs/grpc_proxy.git", rev = "bad24e29529a0bb381f71f02f977752c20c26613" }
